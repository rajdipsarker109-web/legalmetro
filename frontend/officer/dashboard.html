<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Officer Dashboard — LegalMetro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark"><div class="container-fluid px-4">
  <a class="navbar-brand" href="../index.html">⚖️ LegalMetro</a>
  <span class="text-white-50" id="user-name"></span>
  <button class="btn btn-outline-light btn-sm" id="logout-btn">Logout</button>
</div></nav>
<div class="layout-wrapper">
  <aside class="sidebar"><nav id="sidebar-nav"></nav></aside>
  <main class="main-content">
    <h4 class="mb-4">Officer Dashboard</h4>
    <div class="row g-3 mb-4" id="stats-row"></div>
    <ul class="nav nav-pills mb-3" id="filters">
      <li class="nav-item"><button class="nav-link active" data-filter="all">All</button></li>
      <li class="nav-item"><button class="nav-link" data-filter="pending">Pending</button></li>
      <li class="nav-item"><button class="nav-link" data-filter="scheduled">Scheduled</button></li>
      <li class="nav-item"><button class="nav-link" data-filter="done">Done</button></li>
    </ul>
    <div class="table-responsive"><table class="table table-hover bg-white rounded">
      <thead><tr><th>Instrument</th><th>Owner</th><th>Type</th><th>Status</th><th>Submitted</th><th id="deadline-col">Deadline</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table></div>
  </main>
</div>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/utils.js"></script>
<script>
if (!requireRole(['lmo','gatc'])) throw '';
initLayout('officer', 'dashboard');
let allApps = [];
const role = localStorage.getItem('role');

function render(filter) {
  let apps = allApps;
  if (filter === 'pending') apps = apps.filter(a => ['submitted','under_review','docs_approved'].includes(a.status));
  else if (filter === 'scheduled') apps = apps.filter(a => a.status === 'inspection_scheduled');
  else if (filter === 'done') apps = apps.filter(a => ['inspection_done','verified','rejected'].includes(a.status));

  document.getElementById('tbody').innerHTML = apps.map(a => {
    const days = a.gatc_deadline ? daysUntil(a.gatc_deadline) : null;
    const deadline = role === 'gatc' && days !== null
      ? `<span class="${days < 3 ? 'text-danger fw-bold' : ''}">${formatDate(a.gatc_deadline)} (${days}d)</span>` : '—';
    return `<tr>
      <td>${a.instrument?.unique_instrument_id||'—'}</td>
      <td>${a.applicant?.name||'—'}</td>
      <td>${a.application_type}</td><td>${statusBadge(a.status)}</td>
      <td>${formatDate(a.submitted_at)}</td>
      <td>${deadline}</td>
      <td><a href="application-review.html?id=${a.id}" class="btn btn-sm btn-primary">Review</a></td></tr>`;
  }).join('') || '<tr><td colspan="7" class="text-center text-muted">No applications</td></tr>';
}

(async () => {
  allApps = await get('/applications/') || [];
  const pending = allApps.filter(a => !['verified','rejected','failed'].includes(a.status)).length;
  const verified = allApps.filter(a => a.status === 'verified').length;
  const pastDeadline = role === 'gatc' ? allApps.filter(a => a.gatc_deadline && daysUntil(a.gatc_deadline) < 0 && a.status !== 'verified').length : 0;

  document.getElementById('stats-row').innerHTML = `
    <div class="col-md-4"><div class="stat-card"><div class="stat-value">${pending}</div><div class="stat-label">Pending Applications</div></div></div>
    <div class="col-md-4"><div class="stat-card"><div class="stat-value">${verified}</div><div class="stat-label">Verified</div></div></div>
    ${role === 'gatc' ? `<div class="col-md-4"><div class="stat-card border-danger"><div class="stat-value text-danger">${pastDeadline}</div><div class="stat-label">Past 15-day Deadline</div></div></div>` : ''}`;

  if (role !== 'gatc') document.getElementById('deadline-col').style.display = 'none';
  render('all');
})();

document.getElementById('filters').onclick = e => {
  if (e.target.dataset.filter) {
    document.querySelectorAll('#filters .nav-link').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    render(e.target.dataset.filter);
  }
};
</script>
</body>
</html>
