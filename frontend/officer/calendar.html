<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inspection Calendar — LegalMetro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark"><div class="container-fluid px-4">
  <a class="navbar-brand" href="../index.html">⚖️ LegalMetro</a>
  <button class="btn btn-outline-light btn-sm" id="logout-btn">Logout</button>
</div></nav>
<div class="layout-wrapper">
  <aside class="sidebar"><nav id="sidebar-nav"></nav></aside>
  <main class="main-content">
    <h4 class="mb-4">Inspection Calendar</h4>
    <div id="calendar-list"></div>
  </main>
</div>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/utils.js"></script>
<script>
if (!requireRole(['lmo','gatc'])) throw '';
initLayout('officer', 'calendar');
(async () => {
  const apps = (await get('/applications/') || []).filter(a => a.inspection_date);
  apps.sort((a,b) => new Date(a.inspection_date) - new Date(b.inspection_date));
  document.getElementById('calendar-list').innerHTML = apps.length ? apps.map(a => `
    <div class="card p-3 mb-3 d-flex flex-row justify-content-between align-items-center">
      <div><strong>${formatDate(a.inspection_date)}</strong> — ${a.instrument?.unique_instrument_id}
      <br><small>${a.applicant?.name} · ${a.inspection_type} · ${statusBadge(a.status)}</small></div>
      <a href="application-review.html?id=${a.id}" class="btn btn-sm btn-outline-primary">Review</a>
    </div>`).join('') : '<p class="text-muted">No scheduled inspections</p>';
})();
</script>
</body>
</html>
