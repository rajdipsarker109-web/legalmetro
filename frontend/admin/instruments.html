<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Instruments — LegalMetro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark"><div class="container-fluid px-4">
  <a class="navbar-brand" href="../index.html">⚖️ LegalMetro</a>
  <button class="btn btn-outline-light btn-sm" id="logout-btn">Logout</button>
</div></nav>
<div class="layout-wrapper">
  <aside class="sidebar"><nav id="sidebar-nav"></nav></aside>
  <main class="main-content">
    <h4 class="mb-4">Cross-jurisdiction Search</h4>
    <div class="row g-2 mb-3">
      <div class="col-md-3"><input class="form-control" id="q" placeholder="Search ID, serial, owner..."></div>
      <div class="col-md-2"><input class="form-control" id="state" placeholder="State"></div>
      <div class="col-md-2"><input class="form-control" id="district" placeholder="District"></div>
      <div class="col-md-2"><select class="form-select" id="status">
        <option value="">All Status</option>
        <option>verified</option><option>expired</option><option>pending_verification</option><option>registered</option>
      </select></div>
      <div class="col-md-2"><button class="btn btn-primary w-100" id="search-btn">Search</button></div>
    </div>
    <div class="table-responsive"><table class="table table-hover bg-white rounded">
      <thead><tr><th>Instrument ID</th><th>Type</th><th>Owner</th><th>Business</th><th>State</th><th>Status</th><th>Valid Until</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table></div>
  </main>
</div>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/utils.js"></script>
<script>
if (!requireRole('super_admin')) throw '';
initLayout('admin', 'instruments');

async function search() {
  const params = new URLSearchParams();
  ['q','state','district','status'].forEach(k => { const v = document.getElementById(k).value; if(v) params.set(k,v); });
  const data = await get('/admin/instruments?' + params.toString()) || [];
  document.getElementById('tbody').innerHTML = data.map(i => `<tr>
    <td>${i.unique_instrument_id}</td><td>${i.instrument_type}</td>
    <td>${i.owner?.name||'—'}</td><td>${i.owner?.organisation||'—'}</td>
    <td>${i.usage_state}</td><td>${statusBadge(i.current_status)}</td>
    <td>${formatDate(i.cert_valid_until)}</td></tr>`).join('');
}
document.getElementById('search-btn').onclick = search;
search();
</script>
</body>
</html>
