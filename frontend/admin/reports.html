<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — LegalMetro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark"><div class="container-fluid px-4">
  <a class="navbar-brand" href="../index.html">⚖️ LegalMetro</a>
  <button class="btn btn-outline-light btn-sm" id="logout-btn">Logout</button>
</div></nav>
<div class="layout-wrapper">
  <aside class="sidebar"><nav id="sidebar-nav"></nav></aside>
  <main class="main-content">
    <h4 class="mb-4">Export Reports</h4>
    <div class="row g-3">
      <div class="col-md-4"><div class="card p-4 text-center">
        <h5>All Instruments</h5><p class="text-muted">Complete instrument registry</p>
        <button class="btn btn-primary" onclick="exportCsv('instruments')">Download CSV</button>
      </div></div>
      <div class="col-md-4"><div class="card p-4 text-center">
        <h5>Expired Instruments</h5><p class="text-muted">Instruments past validity</p>
        <button class="btn btn-danger" onclick="exportCsv('expired')">Download CSV</button>
      </div></div>
      <div class="col-md-4"><div class="card p-4 text-center">
        <h5>Pending Applications</h5><p class="text-muted">Open verification requests</p>
        <button class="btn btn-warning" onclick="exportCsv('pending')">Download CSV</button>
      </div></div>
    </div>
  </main>
</div>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/utils.js"></script>
<script>
if (!requireRole('super_admin')) throw '';
initLayout('admin', 'reports');
async function exportCsv(type) {
  const token = localStorage.getItem('token');
  const res = await fetch(`http://localhost:5000/api/admin/reports/export?type=${type}`, {
    headers: { Authorization: `Bearer ${token}` }
  });
  const blob = await res.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `legalmetro_${type}.csv`;
  a.click();
}
</script>
</body>
</html>
