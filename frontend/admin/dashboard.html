<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — LegalMetro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark"><div class="container-fluid px-4">
  <a class="navbar-brand" href="../index.html">⚖️ LegalMetro</a>
  <span class="text-white-50" id="user-name"></span>
  <button class="btn btn-outline-light btn-sm" id="logout-btn">Logout</button>
</div></nav>
<div class="layout-wrapper">
  <aside class="sidebar"><nav id="sidebar-nav"></nav></aside>
  <main class="main-content">
    <h4 class="mb-4">Admin Dashboard</h4>
    <div class="row g-3 mb-4" id="stats-row"></div>
    <div class="row g-4 mb-4">
      <div class="col-md-6"><div class="card p-3"><h6>Applications per Month</h6><canvas id="chart-bar"></canvas></div></div>
      <div class="col-md-6"><div class="card p-3"><h6>Instruments by Type</h6><canvas id="chart-pie"></canvas></div></div>
      <div class="col-md-12"><div class="card p-3"><h6>Avg Turnaround (Days) — LMO vs GATC</h6><canvas id="chart-line" height="80"></canvas></div></div>
    </div>
    <h5>Recent Applications</h5>
    <div class="table-responsive"><table class="table table-sm bg-white rounded">
      <thead><tr><th>Instrument</th><th>Owner</th><th>Status</th><th>Officer</th><th>Date</th></tr></thead>
      <tbody id="recent"></tbody>
    </table></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/utils.js"></script>
<script>
if (!requireRole('super_admin')) throw '';
initLayout('admin', 'dashboard');

(async () => {
  const stats = await get('/admin/stats');
  if (!stats) return;
  document.getElementById('stats-row').innerHTML = `
    <div class="col"><div class="stat-card"><div class="stat-value">${stats.total_instruments}</div><div class="stat-label">Total Instruments</div></div></div>
    <div class="col"><div class="stat-card"><div class="stat-value">${stats.verified_this_month}</div><div class="stat-label">Verified This Month</div></div></div>
    <div class="col"><div class="stat-card"><div class="stat-value">${stats.pending_applications}</div><div class="stat-label">Pending</div></div></div>
    <div class="col"><div class="stat-card"><div class="stat-value">${stats.expired_instruments}</div><div class="stat-label">Expired</div></div></div>
    <div class="col"><div class="stat-card"><div class="stat-value">${stats.active_gatcs}</div><div class="stat-label">Active GATCs</div></div></div>`;

  new Chart(document.getElementById('chart-bar'), {
    type: 'bar', data: {
      labels: stats.apps_by_month.map(m => m.month),
      datasets: [{ label: 'Applications', data: stats.apps_by_month.map(m => m.count), backgroundColor: '#1a4b8c' }]
    }, options: { responsive: true, plugins: { legend: { display: false } } }
  });

  new Chart(document.getElementById('chart-pie'), {
    type: 'pie', data: {
      labels: stats.instruments_by_type.map(t => t.type),
      datasets: [{ data: stats.instruments_by_type.map(t => t.count), backgroundColor: ['#1a4b8c','#f15a22','#16a34a','#d97706','#dc2626','#6366f1'] }]
    }, options: { responsive: true }
  });

  new Chart(document.getElementById('chart-line'), {
    type: 'bar', data: {
      labels: ['LMO', 'GATC'],
      datasets: [{ label: 'Avg Days', data: [stats.turnaround.lmo, stats.turnaround.gatc], backgroundColor: ['#1a4b8c','#f15a22'] }]
    }, options: { responsive: true, plugins: { legend: { display: false } } }
  });

  document.getElementById('recent').innerHTML = (stats.recent_applications||[]).map(a => `<tr>
    <td>${a.instrument?.unique_instrument_id||'—'}</td><td>${a.applicant?.name||'—'}</td>
    <td>${statusBadge(a.status)}</td><td>${a.assigned_officer?.name||'—'}</td>
    <td>${formatDate(a.submitted_at)}</td></tr>`).join('');
})();
</script>
</body>
</html>
