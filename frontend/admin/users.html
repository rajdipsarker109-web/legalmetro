<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Users — LegalMetro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark"><div class="container-fluid px-4">
  <a class="navbar-brand" href="../index.html">⚖️ LegalMetro</a>
  <button class="btn btn-outline-light btn-sm" id="logout-btn">Logout</button>
</div></nav>
<div class="layout-wrapper">
  <aside class="sidebar"><nav id="sidebar-nav"></nav></aside>
  <main class="main-content">
    <h4 class="mb-4">Manage LMOs & GATCs</h4>
    <div id="alert-box"></div>
    <ul class="nav nav-tabs mb-3">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#lmo-tab">LMOs</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#gatc-tab">GATCs</button></li>
    </ul>
    <div class="tab-content">
      <div class="tab-pane fade show active" id="lmo-tab">
        <button class="btn btn-primary btn-sm mb-3" data-bs-toggle="collapse" data-bs-target="#add-lmo">+ Add LMO</button>
        <div class="collapse mb-3" id="add-lmo"><div class="card p-3">
          <form id="lmo-form" class="row g-2">
            <div class="col-md-4"><input class="form-control" name="name" placeholder="Name" required></div>
            <div class="col-md-4"><input class="form-control" name="email" placeholder="Email" required></div>
            <div class="col-md-4"><input class="form-control" name="password" placeholder="Password" required></div>
            <div class="col-md-3"><input class="form-control" name="state" placeholder="State"></div>
            <div class="col-md-3"><input class="form-control" name="district" placeholder="District"></div>
            <div class="col-md-3"><input class="form-control" name="designation" placeholder="Designation"></div>
            <div class="col-md-3"><button class="btn btn-success w-100">Create LMO</button></div>
          </form>
        </div></div>
        <table class="table bg-white rounded"><thead><tr><th>Name</th><th>Email</th><th>State</th><th>District</th></tr></thead>
        <tbody id="lmo-list"></tbody></table>
      </div>
      <div class="tab-pane fade" id="gatc-tab">
        <button class="btn btn-primary btn-sm mb-3" data-bs-toggle="collapse" data-bs-target="#add-gatc">+ Add GATC</button>
        <div class="collapse mb-3" id="add-gatc"><div class="card p-3">
          <form id="gatc-form" class="row g-2">
            <div class="col-md-4"><input class="form-control" name="name" placeholder="Name" required></div>
            <div class="col-md-4"><input class="form-control" name="email" placeholder="Email" required></div>
            <div class="col-md-4"><input class="form-control" name="password" placeholder="Password" required></div>
            <div class="col-md-3"><input class="form-control" name="state" placeholder="State"></div>
            <div class="col-md-3"><input class="form-control" name="district" placeholder="District"></div>
            <div class="col-md-3"><input class="form-control" name="organisation" placeholder="Organisation"></div>
            <div class="col-md-3"><button class="btn btn-success w-100">Create GATC</button></div>
            <div class="col-12"><label class="form-label">Approved Categories</label>
              <div id="cat-checks"></div></div>
          </form>
        </div></div>
        <table class="table bg-white rounded"><thead><tr><th>Name</th><th>Email</th><th>District</th><th>Categories</th></tr></thead>
        <tbody id="gatc-list"></tbody></table>
      </div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/utils.js"></script>
<script>
if (!requireRole('super_admin')) throw '';
initLayout('admin', 'users');
document.getElementById('cat-checks').innerHTML = INSTRUMENT_TYPES.map(t =>
  `<label class="me-3"><input type="checkbox" name="cat" value="${t}"> ${t}</label>`).join('');

async function loadUsers() {
  const lmos = await get('/admin/users?role=lmo') || [];
  const gatcs = await get('/admin/users?role=gatc') || [];
  document.getElementById('lmo-list').innerHTML = lmos.map(u => `<tr>
    <td>${u.name}</td><td>${u.email}</td><td>${u.state||'—'}</td><td>${u.district||'—'}</td></tr>`).join('');
  document.getElementById('gatc-list').innerHTML = gatcs.map(u => `<tr>
    <td>${u.name}</td><td>${u.email}</td><td>${u.district||'—'}</td>
    <td><small>${(u.jurisdiction?.approved_categories||[]).join(', ')}</small></td></tr>`).join('');
}
loadUsers();

document.getElementById('lmo-form').onsubmit = async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = Object.fromEntries(fd);
  const res = await post('/admin/users/lmo', body);
  if (res && res.id) { showAlert('alert-box', 'LMO created', 'success'); loadUsers(); e.target.reset(); }
  else showAlert('alert-box', res?.error || 'Failed', 'danger');
};

document.getElementById('gatc-form').onsubmit = async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = Object.fromEntries(fd);
  body.approved_categories = [...document.querySelectorAll('[name=cat]:checked')].map(c => c.value);
  const res = await post('/admin/users/gatc', body);
  if (res && res.id) { showAlert('alert-box', 'GATC created', 'success'); loadUsers(); e.target.reset(); }
  else showAlert('alert-box', res?.error || 'Failed', 'danger');
};
</script>
</body>
</html>
