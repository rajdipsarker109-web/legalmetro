<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — LegalMetro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand" href="index.html">⚖️ LegalMetro</a></div></nav>
<div class="container">
  <div class="card login-card p-4">
    <h3 class="text-center mb-4">Login</h3>
    <div id="alert-box"></div>
    <form id="login-form">
      <div class="mb-3"><label class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required></div>
      <div class="mb-3"><label class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required></div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <p class="text-center mt-3 mb-0">Don't have an account? <a href="register.html">Register</a></p>
    <hr><small class="text-muted">Demo: sharma@store.com / Owner@123</small>
  </div>
</div>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/utils.js"></script>
<script>
document.getElementById('login-form').onsubmit = async e => {
  e.preventDefault();
  try {
    await login(document.getElementById('email').value, document.getElementById('password').value);
  } catch (err) {
    showAlert('alert-box', err.message, 'danger');
  }
};
</script>
</body>
</html>
