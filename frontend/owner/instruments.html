<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Instruments — LegalMetro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark"><div class="container-fluid px-4">
  <a class="navbar-brand" href="../index.html">⚖️ LegalMetro</a>
  <button class="btn btn-outline-light btn-sm" id="logout-btn">Logout</button>
</div></nav>
<div class="layout-wrapper">
  <aside class="sidebar"><nav id="sidebar-nav"></nav></aside>
  <main class="main-content">
    <div class="d-flex justify-content-between mb-4">
      <h4>My Instruments</h4>
      <a href="instrument-register.html" class="btn btn-primary btn-sm">+ Register</a>
    </div>
    <input type="text" class="form-control mb-3" id="search" placeholder="Search by ID or serial...">
    <div class="table-responsive"><table class="table table-hover bg-white rounded">
      <thead><tr><th>Instrument ID</th><th>Type</th><th>Serial</th><th>Status</th><th>Valid Until</th><th>Actions</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table></div>
  </main>
</div>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/utils.js"></script>
<script>
if (!requireRole('business_owner')) throw '';
initLayout('business_owner', 'instruments');
let all = [];
async function render(filter='') {
  const q = filter.toLowerCase();
  const rows = all.filter(i => !q || i.unique_instrument_id.toLowerCase().includes(q) || (i.serial_number||'').toLowerCase().includes(q));
  document.getElementById('tbody').innerHTML = rows.map(i => `<tr>
    <td>${i.unique_instrument_id}</td><td>${i.instrument_type}</td><td>${i.serial_number||'—'}</td>
    <td>${statusBadge(i.current_status)}</td><td>${formatDate(i.cert_valid_until)}</td>
    <td><a href="instrument-detail.html?id=${i.id}" class="btn btn-sm btn-outline-primary">View</a>
    <a href="application-new.html?instrument=${i.id}" class="btn btn-sm btn-outline-secondary">Apply</a></td></tr>`).join('');
}
(async () => { all = await get('/instruments/') || []; render(); })();
document.getElementById('search').oninput = e => render(e.target.value);
</script>
</body>
</html>
