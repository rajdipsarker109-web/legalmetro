<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application Detail — LegalMetro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark"><div class="container-fluid px-4">
  <a class="navbar-brand" href="../index.html">⚖️ LegalMetro</a>
  <button class="btn btn-outline-light btn-sm" id="logout-btn">Logout</button>
</div></nav>
<div class="layout-wrapper">
  <aside class="sidebar"><nav id="sidebar-nav"></nav></aside>
  <main class="main-content">
    <div id="content"><div class="spinner-border text-primary"></div></div>
  </main>
</div>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/utils.js"></script>
<script>
if (!requireRole('business_owner')) throw '';
initLayout('business_owner', 'applications');
const id = new URLSearchParams(location.search).get('id');
const steps = ['submitted','under_review','docs_approved','inspection_scheduled','inspection_done','verified'];
const labels = ['Submitted','Under Review','Docs Approved','Scheduled','Inspected','Verified'];

(async () => {
  const app = await get(`/applications/${id}`);
  if (!app || app.error) { document.getElementById('content').innerHTML = '<p>Not found</p>'; return; }
  const idx = steps.indexOf(app.status);
  const progress = labels.map((l,i) => `<div class="progress-step ${i<=idx?'done':''} ${i===idx?'active':''}">${l}</div>`).join('');
  document.getElementById('content').innerHTML = `
    <h4>Application Tracker</h4>
    <p>${app.instrument?.unique_instrument_id} — ${statusBadge(app.status)}</p>
    <div class="progress-steps">${progress}</div>
    <div class="card p-4">
      <p><strong>Type:</strong> ${app.application_type}</p>
      <p><strong>Submitted:</strong> ${formatDate(app.submitted_at)}</p>
      <p><strong>Assigned To:</strong> ${app.assigned_officer?.name||'—'} (${app.assigned_type?.toUpperCase()||''})</p>
      ${app.inspection_date ? `<p><strong>Inspection:</strong> ${formatDate(app.inspection_date)} (${app.inspection_type})</p>` : ''}
      ${app.rejection_reason ? `<div class="alert alert-danger">${app.rejection_reason}</div>` : ''}
      ${app.certificates?.length ? `<a href="http://localhost:5000/api/certificates/${app.certificates[0].id}/download" class="btn btn-success">Download Certificate</a>` : ''}
    </div>`;
})();
</script>
</body>
</html>
