<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificates — LegalMetro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark"><div class="container-fluid px-4">
  <a class="navbar-brand" href="../index.html">⚖️ LegalMetro</a>
  <button class="btn btn-outline-light btn-sm" id="logout-btn">Logout</button>
</div></nav>
<div class="layout-wrapper">
  <aside class="sidebar"><nav id="sidebar-nav"></nav></aside>
  <main class="main-content">
    <h4 class="mb-4">My Certificates</h4>
    <div id="cert-list"></div>
  </main>
</div>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/utils.js"></script>
<script>
if (!requireRole('business_owner')) throw '';
initLayout('business_owner', 'certificates');
(async () => {
  const instruments = await get('/instruments/') || [];
  let html = '';
  for (const inst of instruments) {
    const certs = await get(`/instruments/${inst.id}/certs`) || [];
    for (const c of certs) {
      html += `<div class="card p-3 mb-3 d-flex flex-row justify-content-between align-items-center">
        <div><strong>${c.certificate_number}</strong><br>
        <small>${inst.unique_instrument_id} · Valid until ${formatDate(c.valid_until)}</small></div>
        <a href="http://localhost:5000/api/certificates/${c.id}/download" class="btn btn-primary btn-sm">Download PDF</a>
      </div>`;
    }
  }
  document.getElementById('cert-list').innerHTML = html || '<p class="text-muted">No certificates yet</p>';
})();
</script>
</body>
</html>
