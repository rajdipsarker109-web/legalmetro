<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Application — LegalMetro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark"><div class="container-fluid px-4">
  <a class="navbar-brand" href="../index.html">⚖️ LegalMetro</a>
  <button class="btn btn-outline-light btn-sm" id="logout-btn">Logout</button>
</div></nav>
<div class="layout-wrapper">
  <aside class="sidebar"><nav id="sidebar-nav"></nav></aside>
  <main class="main-content">
    <h4 class="mb-4">Submit Verification Application</h4>
    <div id="alert-box"></div>
    <form id="app-form" class="card p-4" style="max-width:600px">
      <div class="mb-3"><label class="form-label">Select Instrument *</label>
        <select class="form-select" id="instrument_id" required></select></div>
      <div class="mb-3"><label class="form-label">Application Type *</label>
        <select class="form-select" id="application_type" required>
          <option value="new">New Verification</option>
          <option value="re_verification">Re-verification</option>
          <option value="post_repair">Post Repair</option>
        </select></div>
      <div class="mb-3"><label class="form-label">Preferred Verifier *</label>
        <select class="form-select" id="preferred_verifier" required>
          <option value="lmo">LMO (State Department)</option>
          <option value="gatc">GATC (Govt. Approved Test Centre)</option>
        </select></div>
      <div class="card bg-light p-3 mb-3">
        <p class="mb-2"><strong>Fee:</strong> ₹500.00</p>
        <button type="button" class="btn btn-sm btn-success" id="pay-btn">Pay Online (Demo)</button>
        <span id="paid-badge" class="badge bg-success ms-2" style="display:none">Paid ✓</span>
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn" disabled>Submit Application</button>
    </form>
  </main>
</div>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/utils.js"></script>
<script>
if (!requireRole('business_owner')) throw '';
initLayout('business_owner', 'applications');
let feePaid = false;
const preselect = new URLSearchParams(location.search).get('instrument');

document.getElementById('pay-btn').onclick = () => {
  feePaid = true;
  document.getElementById('paid-badge').style.display = 'inline';
  document.getElementById('submit-btn').disabled = false;
};

(async () => {
  const instruments = await get('/instruments/') || [];
  const sel = document.getElementById('instrument_id');
  sel.innerHTML = instruments.map(i => `<option value="${i.id}" ${i.id===preselect?'selected':''}>${i.unique_instrument_id} — ${i.instrument_type}</option>`).join('');
  if (!instruments.length) sel.innerHTML = '<option value="">No instruments — register one first</option>';
})();

document.getElementById('app-form').onsubmit = async e => {
  e.preventDefault();
  if (!feePaid) return showAlert('alert-box', 'Please pay the fee first', 'warning');
  const data = await post('/applications/', {
    instrument_id: document.getElementById('instrument_id').value,
    application_type: document.getElementById('application_type').value,
    preferred_verifier: document.getElementById('preferred_verifier').value,
    fee_paid: true,
  });
  if (data && data.id) {
    showAlert('alert-box', 'Application submitted successfully!', 'success');
    setTimeout(() => location.href = `application-detail.html?id=${data.id}`, 1500);
  } else {
    showAlert('alert-box', data?.error || 'Submission failed', 'danger');
  }
};
</script>
</body>
</html>
