<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instrument Detail — LegalMetro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark"><div class="container-fluid px-4">
  <a class="navbar-brand" href="../index.html">⚖️ LegalMetro</a>
  <button class="btn btn-outline-light btn-sm" id="logout-btn">Logout</button>
</div></nav>
<div class="layout-wrapper">
  <aside class="sidebar"><nav id="sidebar-nav"></nav></aside>
  <main class="main-content">
    <div id="content"><div class="text-center py-5"><div class="spinner-border text-primary"></div></div></div>
  </main>
</div>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/utils.js"></script>
<script>
if (!requireRole('business_owner')) throw '';
initLayout('business_owner', 'instruments');
const id = new URLSearchParams(location.search).get('id');
if (!id) location.href = 'instruments.html';

(async () => {
  const [inst, history, certs] = await Promise.all([
    get(`/instruments/${id}`), get(`/instruments/${id}/history`), get(`/instruments/${id}/certs`)
  ]);
  if (!inst || inst.error) { document.getElementById('content').innerHTML = '<p>Not found</p>'; return; }
  document.getElementById('content').innerHTML = `
    <h4>${inst.unique_instrument_id} ${statusBadge(inst.current_status)}</h4>
    <div class="row mt-4">
      <div class="col-md-8">
        <ul class="nav nav-tabs" role="tablist">
          <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#overview">Overview</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#certs">Certificates</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#audit">Audit History</button></li>
        </ul>
        <div class="tab-content card p-4 border-top-0">
          <div class="tab-pane fade show active" id="overview">
            <p><strong>Type:</strong> ${inst.instrument_type}</p>
            <p><strong>Make/Model:</strong> ${inst.make||'—'} / ${inst.model_name||'—'}</p>
            <p><strong>Serial:</strong> ${inst.serial_number||'—'}</p>
            <p><strong>Location:</strong> ${inst.usage_address||''}, ${inst.usage_district}, ${inst.usage_state}</p>
            <p><strong>Valid Until:</strong> ${formatDate(inst.cert_valid_until)}</p>
          </div>
          <div class="tab-pane fade" id="certs">
            ${(certs||[]).length ? certs.map(c => `<div class="mb-2">${c.certificate_number} — ${formatDate(c.valid_until)}
              <a href="http://localhost:5000/api/certificates/${c.id}/download" class="btn btn-sm btn-outline-primary ms-2">Download</a></div>`).join('') : '<p class="text-muted">No certificates yet</p>'}
          </div>
          <div class="tab-pane fade" id="audit">
            <div class="timeline">${(history||[]).map(h => `<div class="timeline-item"><strong>${h.event_type.replace(/_/g,' ')}</strong>
              <div class="text-muted small">${formatDate(h.timestamp)} — ${h.description||''}</div></div>`).join('')}</div>
          </div>
        </div>
      </div>
      <div class="col-md-4 text-center">
        ${inst.qr_code_url ? `<img src="http://localhost:5000${inst.qr_code_url}" alt="QR" class="img-fluid" style="max-width:200px">` : ''}
        <a href="application-new.html?instrument=${inst.id}" class="btn btn-primary mt-3 w-100">Apply for Verification</a>
      </div>
    </div>`;
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
