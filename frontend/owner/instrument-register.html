<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Instrument — LegalMetro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark"><div class="container-fluid px-4">
  <a class="navbar-brand" href="../index.html">⚖️ LegalMetro</a>
  <button class="btn btn-outline-light btn-sm" id="logout-btn">Logout</button>
</div></nav>
<div class="layout-wrapper">
  <aside class="sidebar"><nav id="sidebar-nav"></nav></aside>
  <main class="main-content">
    <h4 class="mb-4">Register New Instrument</h4>
    <div id="alert-box"></div>
    <div id="success-panel" style="display:none" class="card p-4 text-center">
      <h5 class="text-success">✅ Instrument Registered!</h5>
      <p id="new-id"></p>
      <div id="qr-display"></div>
      <a href="instruments.html" class="btn btn-primary mt-3">View All Instruments</a>
    </div>
    <form id="reg-form" class="card p-4" enctype="multipart/form-data">
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Instrument Type *</label>
          <select class="form-select" name="instrument_type" required id="inst-type"></select></div>
        <div class="col-md-6"><label class="form-label">Make</label><input class="form-control" name="make"></div>
        <div class="col-md-6"><label class="form-label">Model Name</label><input class="form-control" name="model_name"></div>
        <div class="col-md-6"><label class="form-label">Serial Number</label><input class="form-control" name="serial_number"></div>
        <div class="col-md-6"><label class="form-label">Manufacturer</label><input class="form-control" name="manufacturer_name"></div>
        <div class="col-md-6"><label class="form-label">Usage State *</label><input class="form-control" name="usage_state" required></div>
        <div class="col-md-6"><label class="form-label">Usage District *</label><input class="form-control" name="usage_district" required></div>
        <div class="col-12"><label class="form-label">Usage Address</label><textarea class="form-control" name="usage_address" rows="2"></textarea></div>
        <div class="col-md-6"><label class="form-label">Model Approval Certificate</label><input type="file" class="form-control" name="model_approval_certificate"></div>
        <div class="col-md-6"><label class="form-label">Purchase Invoice</label><input type="file" class="form-control" name="purchase_invoice"></div>
      </div>
      <button type="submit" class="btn btn-primary mt-4">Register Instrument</button>
    </form>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/utils.js"></script>
<script>
if (!requireRole('business_owner')) throw '';
initLayout('business_owner', 'instruments');
document.getElementById('inst-type').innerHTML = INSTRUMENT_TYPES.map(t => `<option>${t}</option>`).join('');

document.getElementById('reg-form').onsubmit = async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const data = await postForm('/instruments/', fd);
  if (data && data.unique_instrument_id) {
    document.getElementById('reg-form').style.display = 'none';
    document.getElementById('success-panel').style.display = 'block';
    document.getElementById('new-id').textContent = data.unique_instrument_id;
    const qrDiv = document.getElementById('qr-display');
    qrDiv.innerHTML = '';
    if (data.qr_code_url) {
      qrDiv.innerHTML = `<img src="http://localhost:5000${data.qr_code_url}" alt="QR" style="max-width:200px">`;
    } else {
      new QRCode(qrDiv, { text: `http://localhost:3000/verify.html?id=${data.unique_instrument_id}`, width: 180, height: 180 });
    }
  } else {
    showAlert('alert-box', data?.error || 'Registration failed', 'danger');
  }
};
</script>
</body>
</html>
