<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applications — LegalMetro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark"><div class="container-fluid px-4">
  <a class="navbar-brand" href="../index.html">⚖️ LegalMetro</a>
  <button class="btn btn-outline-light btn-sm" id="logout-btn">Logout</button>
</div></nav>
<div class="layout-wrapper">
  <aside class="sidebar"><nav id="sidebar-nav"></nav></aside>
  <main class="main-content">
    <div class="d-flex justify-content-between mb-4">
      <h4>My Applications</h4>
      <a href="application-new.html" class="btn btn-primary btn-sm">+ New Application</a>
    </div>
    <div class="table-responsive"><table class="table table-hover bg-white rounded">
      <thead><tr><th>App ID</th><th>Instrument</th><th>Type</th><th>Status</th><th>Submitted</th><th>Assigned To</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table></div>
  </main>
</div>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/utils.js"></script>
<script>
if (!requireRole('business_owner')) throw '';
initLayout('business_owner', 'applications');
(async () => {
  const apps = await get('/applications/') || [];
  document.getElementById('tbody').innerHTML = apps.map(a => `<tr>
    <td><small>${a.id.slice(0,8)}...</small></td>
    <td>${a.instrument?.unique_instrument_id||'—'}</td>
    <td>${a.application_type}</td><td>${statusBadge(a.status)}</td>
    <td>${formatDate(a.submitted_at)}</td>
    <td>${a.assigned_officer?.name||'—'}</td>
    <td><a href="application-detail.html?id=${a.id}" class="btn btn-sm btn-outline-primary">View</a></td></tr>`).join('') ||
    '<tr><td colspan="7" class="text-muted text-center">No applications yet</td></tr>';
})();
</script>
</body>
</html>
