<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — LegalMetro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand" href="index.html">⚖️ LegalMetro</a></div></nav>
<div class="container">
  <div class="card login-card p-4">
    <h3 class="text-center mb-4">Business Owner Registration</h3>
    <div id="alert-box"></div>
    <form id="reg-form">
      <div class="mb-3"><label class="form-label">Full Name</label><input class="form-control" id="name" required></div>
      <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" id="email" required></div>
      <div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control" id="password" required minlength="6"></div>
      <div class="mb-3"><label class="form-label">Phone</label><input class="form-control" id="phone"></div>
      <div class="mb-3"><label class="form-label">Organisation</label><input class="form-control" id="organisation"></div>
      <div class="row">
        <div class="col mb-3"><label class="form-label">State</label><input class="form-control" id="state" required></div>
        <div class="col mb-3"><label class="form-label">District</label><input class="form-control" id="district" required></div>
      </div>
      <button type="submit" class="btn btn-primary w-100">Register</button>
    </form>
    <p class="text-center mt-3"><a href="login.html">Already have an account? Login</a></p>
  </div>
</div>
<script src="assets/js/api.js"></script>
<script src="assets/js/utils.js"></script>
<script>
document.getElementById('reg-form').onsubmit = async e => {
  e.preventDefault();
  const body = {
    name: document.getElementById('name').value,
    email: document.getElementById('email').value,
    password: document.getElementById('password').value,
    phone: document.getElementById('phone').value,
    organisation: document.getElementById('organisation').value,
    state: document.getElementById('state').value,
    district: document.getElementById('district').value,
  };
  const data = await post('/auth/register', body);
  if (data && data.message) {
    showAlert('alert-box', 'Registration successful! Redirecting to login...', 'success');
    setTimeout(() => window.location.href = 'login.html', 1500);
  } else {
    showAlert('alert-box', data?.error || 'Registration failed', 'danger');
  }
};
</script>
</body>
</html>
